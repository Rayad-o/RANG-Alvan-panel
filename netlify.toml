# فقط فرانت‌اند روی Netlify منتشر می‌شود (بدون build).
# درخواست‌های API توسط Netlify به بک‌اند Rang پراکسی می‌شوند؛ بنابراین مرورگر فقط با
# https://<site>.netlify.app صحبت می‌کند (بدون خطای mixed-content و بدون نیاز به CORS).
#
# اگر آدرس بک‌اند عوض شد (یا دامنهٔ HTTPS گرفتید)، همهٔ `to` های زیر را تغییر دهید.

[build]
  publish = "frontend"

[[redirects]]
  from = "/auth/*"
  to = "http://185.239.0.76:8080/auth/:splat"
  status = 200
  force = true

# صفحهٔ داشبورد (/dashboard بدون پسوند) نباید به API پراکسی شود؛ این قانون باید قبل از /dashboard/* بیاید.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "http://185.239.0.76:8080/dashboard/:splat"
  status = 200
  force = true

