<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="login-container">
        <div class="brand-mark">R</div>
        <h1>سامانه گزارش‌دهی مدیریتی</h1>
        <p class="sub">برای ادامه وارد حساب خود شوید</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" required autocomplete="username" placeholder="ایمیل خود را وارد کنید" dir="ltr">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="رمز عبور" dir="ltr">
            </div>
            <button type="submit" class="btn block" id="loginBtn">ورود</button>
            <p id="errorMessage" class="error" role="alert"></p>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="js/config.js"></script>
    <script src="js/scene.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
